<div
  *ngIf="open"
  class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="titulo-anular"
  (keydown)="onKeydown($event)"
>
  <div
    #dialogPanel
    class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 space-y-4"
  >
    <div class="flex items-center justify-between">
      <h2 id="titulo-anular" class="text-lg font-bold text-[#293954]">Anular receta</h2>
      <button
        type="button"
        (click)="cerrar()"
        aria-label="Cerrar diálogo de anulación"
        class="text-slate-400 hover:text-slate-600 p-1 rounded-lg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#049CAB]"
      >
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
      </button>
    </div>

    <p class="text-sm text-slate-600">
      Esta acción requiere confirmación explícita. La receta quedará en estado anulada y se
      conservará su trazabilidad.
    </p>

    <div
      *ngIf="errorMessage()"
      class="p-3 rounded-xl bg-rose-50 text-rose-700 text-xs border border-rose-200"
      role="alert"
      aria-live="assertive"
    >
      <p class="font-semibold">No se pudo completar la anulación</p>
      <p class="mt-1">{{ errorMessage() }}</p>
      <p *ngIf="errorCode()" class="mt-1 font-mono">Código: {{ errorCode() }}</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="confirmar()" class="space-y-4" novalidate>
      <div>
        <label for="motivo-anulacion" class="block text-xs font-semibold text-slate-700 mb-1">
          Motivo de anulación * (15 a 500 caracteres)
        </label>
        <textarea
          #motivoField
          id="motivo-anulacion"
          formControlName="motivo_anulacion"
          rows="4"
          maxlength="500"
          aria-describedby="motivo-anulacion-error"
          placeholder="Describa el motivo clínico o administrativo..."
          class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-500"
        ></textarea>
        <p
          *ngIf="form.controls.motivo_anulacion.touched && form.controls.motivo_anulacion.invalid"
          id="motivo-anulacion-error"
          class="text-xs text-rose-600 mt-1"
          role="alert"
        >
          El motivo es obligatorio (mínimo 15, máximo 500 caracteres).
        </p>
      </div>

      <div>
        <label
          for="observaciones-anulacion"
          class="block text-xs font-semibold text-slate-700 mb-1"
        >
          Observaciones (opcional)
        </label>
        <textarea
          id="observaciones-anulacion"
          formControlName="observaciones_anulacion"
          rows="2"
          placeholder="Información adicional..."
          class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-500"
        ></textarea>
      </div>

      <div>
        <label for="receta-sustituta" class="block text-xs font-semibold text-slate-700 mb-1">
          Receta sustituta (ID, opcional)
        </label>
        <input
          id="receta-sustituta"
          type="number"
          min="1"
          formControlName="id_receta_sustituta"
          placeholder="Ej. 58"
          class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-rose-500"
        />
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          (click)="cerrar()"
          [disabled]="isSubmitting()"
          class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-400"
        >
          Volver
        </button>
        <button
          type="submit"
          [disabled]="isSubmitting() || form.invalid"
          class="px-4 py-2 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 disabled:opacity-50 transition shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-600"
        >
          {{ isSubmitting() ? 'Anulando...' : 'Confirmar anulación' }}
        </button>
      </div>
    </form>
  </div>
</div>
