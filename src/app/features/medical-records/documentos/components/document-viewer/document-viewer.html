<div class="document-viewer">
  <!-- Estado de Carga -->
  <div *ngIf="isLoading()" class="py-16 text-center space-y-3">
    <div class="inline-block w-8 h-8 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
    <p class="text-sm font-medium text-on-surface-variant">Cargando documento...</p>
  </div>

  <!-- Error -->
  <div *ngIf="!isLoading() && errorMessage()" class="py-12 text-center space-y-3">
    <span class="material-symbols-outlined text-[40px] text-rose-400">picture_as_pdf</span>
    <p class="text-sm font-medium text-rose-600">{{ errorMessage() }}</p>
  </div>

  <!-- Visor PDF Nativo -->
  <div *ngIf="!isLoading() && !errorMessage() && safePdfUrl()" class="bg-white rounded-xl border border-outline-variant/30 overflow-hidden shadow-sm">
    <iframe
      [src]="safePdfUrl()!"
      class="w-full h-[75vh] border-0 rounded-xl"
      title="Visor de Documento Clínico"
    ></iframe>
  </div>
</div>
