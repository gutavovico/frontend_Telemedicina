name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  NPM_VERSION: '11'

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps

  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint 2>&1 || echo "Lint script no configurado, saltando"

  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:vitest

  build:
    name: Build Production
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npx cypress install
      - name: Start Angular, wait for HTTP and run Cypress
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:4200
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/angular-e2e.log"
          npm run start -- --host 127.0.0.1 --port 4200 > "$log" 2>&1 &
          server_pid=$!
          trap 'cat "$log"; kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          deadline=$((SECONDS + 120))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo '::error::Angular terminó antes de responder en http://127.0.0.1:4200/'
              exit 1
            fi
            if curl --fail --silent --connect-timeout 2 --max-time 5 --output /dev/null http://127.0.0.1:4200/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo '::error::Angular no respondió en http://127.0.0.1:4200/ dentro de 120 segundos'
            exit 1
          fi

          echo 'Angular ready at http://127.0.0.1:4200/'
          npx cypress run --browser chrome

  deploy-preview:
    name: Deploy Preview (Netlify/Vercel)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Deploy to Netlify Preview
        if: false  # Configurar cuando se tenga cuenta Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: './dist/frontend_Telemedicina/browser'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Preview deploy for PR #${{ github.event.number }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Deploy to Production
        if: false  # Configurar cuando se tenga hosting
        run: |
          echo "Deploy to production hosting (Netlify, Vercel, AWS S3+CloudFront, etc.)"
